---
- name: Transfer verified backup artifacts through private controller storage
  hosts: all:!restore_target
  become: true
  gather_facts: false
  tasks:
    - name: Validate owned backup path
      ansible.builtin.assert:
        that:
          - backup_manifest.artifacts[inventory_hostname].file is match('^/var/lib/autoops-database-backups/[0-9]+/[0-9]+/[0-9]+/backup.tar$')
    - name: Fetch backup artifact
      ansible.builtin.fetch:
        src: '{{ backup_manifest.artifacts[inventory_hostname].file }}'
        dest: '{{ result_dir }}/{{ inventory_hostname }}.tar'
        flat: true

- name: Restore into isolated directories and ports
  hosts: restore_target
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install restore runtime dependencies
      ansible.builtin.apt:
        lock_timeout: "{{ 300 if ansible_version.full is version('2.12', '>=') else omit }}"
        name: [python3-pymysql, python3-psycopg2, python3-redis]
        state: present
        policy_rc_d: 101
    - name: Create restore service user
      ansible.builtin.user:
        name: autoopsdb
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Restore each shard or database backup independently
      ansible.builtin.include_tasks: restore-instance.yml
      loop: '{{ backup_manifest.members }}'
      loop_control:
        loop_var: source_member
        index_var: shard_index
