---
- name: Deploy independently owned HAProxy entrypoints
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Ensure isolated service account
      ansible.builtin.user:
        name: autoopsdb
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Configure MySQL role probes
      ansible.builtin.include_tasks: role-probe-tasks.yml
      when: member.kind == 'data' and db_cluster.engine == 'mysql'
    - name: Configure proxy members
      when: member.kind == 'proxy'
      block:
        - name: Install HAProxy without starting distribution service
          ansible.builtin.apt:
            lock_timeout: 300
            name: haproxy
            state: present
            policy_rc_d: 101
        - name: Create isolated proxy directory
          ansible.builtin.file:
            path: '{{ member.dataDir }}'
            state: directory
            owner: autoopsdb
            group: autoopsdb
            mode: '0700'
        - name: Start every backend down until role checks succeed
          ansible.builtin.template:
            src: haproxy-state.j2
            dest: '{{ member.dataDir }}/initial-state'
            owner: autoopsdb
            group: autoopsdb
            mode: '0600'
        - name: Configure role-sensitive entrypoints
          ansible.builtin.template:
            src: haproxy.cfg.j2
            dest: '{{ member.dataDir }}/haproxy.cfg'
            owner: autoopsdb
            group: autoopsdb
            mode: '0600'
            validate: /usr/sbin/haproxy -c -f %s
          no_log: true
        - name: Install proxy unit
          ansible.builtin.template:
            src: generic.service.j2
            dest: '/etc/systemd/system/{{ member.service }}.service'
            mode: '0644'
          vars:
            executable: '/usr/sbin/haproxy -W -db -f {{ member.dataDir }}/haproxy.cfg'
        - name: Start isolated proxy
          ansible.builtin.systemd:
            name: '{{ member.service }}'
            state: restarted
            enabled: true
            daemon_reload: true
