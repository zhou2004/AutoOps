---
- name: Install Sentinel binary
  ansible.builtin.apt:
    lock_timeout: 300
    name: redis-server
    state: present
    policy_rc_d: 101
    update_cache: true
    cache_valid_time: 3600
- name: Configure authenticated Sentinel
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: '{{ member.dataDir }}/sentinel.conf'
    owner: autoopsdb
    group: autoopsdb
    mode: '0600'
  no_log: true
- name: Install isolated Sentinel service
  ansible.builtin.template:
    src: generic.service.j2
    dest: '/etc/systemd/system/{{ member.service }}.service'
    mode: '0644'
  vars:
    executable: '/usr/bin/redis-server {{ member.dataDir }}/sentinel.conf --sentinel'
