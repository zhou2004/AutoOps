x-app-env: &app-env
  TZ: ${TZ:-Asia/Shanghai}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE:-autoops}
  DB_USER: autoops
  DB_PASSWORD: ${MYSQL_PASSWORD:?Run docker/setup.sh and configure docker/.env}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  AUTOOPS_JWT_SECRET: ${AUTOOPS_JWT_SECRET:?Set AUTOOPS_JWT_SECRET}
  AUTOOPS_INITIAL_ADMIN_PASSWORD: ${AUTOOPS_INITIAL_ADMIN_PASSWORD:?Set initial admin password}
  WEB_ENCRYPTION_KEY: ${WEB_ENCRYPTION_KEY:-}
  WEB_KEY_FILE: /app/data/web.key
  AIOPS_ENCRYPTION_KEY: ${AIOPS_ENCRYPTION_KEY:-}
  AIOPS_KEY_FILE: /app/data/aiops.key
services:
  mysql:
    image: mysql:8.0.33
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autoops}
      MYSQL_USER: autoops
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../api/sql/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
  devops-api:
    image: ${AUTOOPS_IMAGE_REGISTRY:-feelzhou}/autoops-api:${AUTOOPS_IMAGE_TAG:-v1.1.0}
    build: {context: .., dockerfile: docker/api/Dockerfile}
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_WORKER_MODE: external
      WEB_WORKER_MODE: external
      AUTOOPS_REGISTRATION_ENABLED: ${AUTOOPS_REGISTRATION_ENABLED:-true}
      AUTOOPS_SMTP_HOST: ${AUTOOPS_SMTP_HOST:-}
      AUTOOPS_SMTP_PORT: ${AUTOOPS_SMTP_PORT:-465}
      AUTOOPS_SMTP_USER: ${AUTOOPS_SMTP_USER:-}
      AUTOOPS_SMTP_PASSWORD: ${AUTOOPS_SMTP_PASSWORD:-}
      AUTOOPS_SMTP_FROM: ${AUTOOPS_SMTP_FROM:-}
      AUTOOPS_SMTP_TLS: ${AUTOOPS_SMTP_TLS:-tls}
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
      - app-state:/app/data
      - uploads:/app/upload
      - task-data:/app/task
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 30s
  database-worker:
    image: ${AUTOOPS_IMAGE_REGISTRY:-feelzhou}/autoops-api:${AUTOOPS_IMAGE_TAG:-v1.1.0}
    restart: unless-stopped
    command: [/app/devops, -mode, database-worker, -c, /app/config.yaml]
    environment: *app-env
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
    depends_on:
      mysql: {condition: service_healthy}
    stop_grace_period: 30s
  web-worker:
    image: ${AUTOOPS_IMAGE_REGISTRY:-feelzhou}/autoops-api:${AUTOOPS_IMAGE_TAG:-v1.1.0}
    restart: unless-stopped
    command: [/app/devops, -mode, web-worker, -c, /app/config.yaml]
    environment: *app-env
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
      - app-state:/app/data
    depends_on:
      mysql: {condition: service_healthy}
    stop_grace_period: 30s
  devops-web:
    image: ${AUTOOPS_IMAGE_REGISTRY:-feelzhou}/autoops-web:${AUTOOPS_IMAGE_TAG:-v1.1.0}
    build: {context: .., dockerfile: docker/web/Dockerfile}
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]
    volumes: [uploads:/home/devops/upload:ro]
    depends_on: [devops-api]
volumes:
  mysql-data:
  redis-data:
  app-state:
  uploads:
  task-data:
